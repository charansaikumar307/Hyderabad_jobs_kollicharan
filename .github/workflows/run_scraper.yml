name: Scrape Jobs to GitHub JSON

on:
  schedule:
    # Runs daily at 9:30 AM IST (04:00 UTC) and 6:30 PM IST (13:00 UTC)
    - cron: "0 4,13 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install JobSpy
        run: pip install -U python-jobspy requests openpyxl

      - name: Run Scraper
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python scraper.py

      - name: Commit updated JSON files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          git add jobs.json companies.json
          git diff --staged --quiet || git commit -m "chore: update GCC/MNC jobs and companies"
          git push
          
